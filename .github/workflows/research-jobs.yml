name: Research jobs

on:
  workflow_dispatch:
    inputs:
      query:
        description: Optional single search, such as motorsports engineering internships
        required: false
        type: string
      depth:
        description: quick, standard, or deep. Sent by the jobs page.
        required: false
        type: string
      run_id:
        description: Existing research run id, when started from the dashboard
        required: false
        type: string

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/research-jobs.ts
        env:
          RESEARCH_TRIGGER: ${{ github.event_name }}
          RESEARCH_QUERY: ${{ inputs.query }}
          RESEARCH_DEPTH: ${{ inputs.depth }}
          RESEARCH_RUN_ID: ${{ inputs.run_id }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RESEARCH_MODEL: ${{ secrets.OPENAI_RESEARCH_MODEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
